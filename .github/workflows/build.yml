name: Build Windows

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Libraries & ThirdParty
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ..\Libraries
            ..\ThirdParty
          key: win64-deps-${{ hashFiles('Telegram/build/prepare/prepare.py') }}

      - name: Prepare
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: Telegram\build\prepare\win.bat

      - name: Configure
        shell: cmd
        working-directory: ${{ github.workspace }}\Telegram
        run: configure.bat x64 -DTDESKTOP_API_ID=2040 -DTDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 -DDESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: cmake --build out --config Release --target Telegram --parallel

      - uses: actions/upload-artifact@v4
        with:
          name: KiwiGram
          path: out\Release\Telegram.exe
