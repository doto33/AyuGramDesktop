name: Build Windows
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache Libraries & ThirdParty
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: |
            ${{ github.workspace }}\..\Libraries
            ${{ github.workspace }}\..\ThirdParty
          key: win64-deps-windows-2022-x64-qt5.15.19-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/prepare/win.bat') }}

      - name: Prepare
        if: steps.cache-deps.outputs.cache-hit != 'true'
        shell: cmd
        working-directory: ${{ github.workspace }}
        timeout-minutes: 240
        run: |
          call Telegram\build\prepare\win.bat
          if errorlevel 1 (
            echo Prepare failed!
            exit /b 1
          )

      - name: Configure
        shell: cmd
        working-directory: ${{ github.workspace }}\Telegram
        run: >
          call configure.bat x64
          -D TDESKTOP_API_ID=2040
          -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

      - name: Build
        shell: cmd
        working-directory: ${{ github.workspace }}
        timeout-minutes: 120
        run: cmake --build out --config Release --target Telegram --parallel 2 -- /p:TrackFileAccess=false /p:RunCodeAnalysis=false

      - name: Diagnose
        if: always()
        shell: cmd
        working-directory: ${{ github.workspace }}
        run: |
          echo === EXE files in out\ ===
          dir /s /b out\*.exe 2>nul || echo NO EXE FILES FOUND
          echo === Contents of out\Release\ ===
          dir out\Release\ 2>nul || echo out\Release\ does not exist

      - name: Package artifact
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $mainExe = Get-ChildItem -Path "out" -Recurse -File |
            Where-Object { $_.Name -eq "Telegram.exe" -or $_.Name -eq "AyuGram.exe" } |
            Select-Object -First 1

          if (-not $mainExe) {
            Write-Host "ERROR: Telegram.exe / AyuGram.exe not found"
            Get-ChildItem -Path "out" -Recurse -File -Filter "*.exe" |
              ForEach-Object { Write-Host "  $($_.FullName)" }
            exit 1
          }

          Write-Host "Found: $($mainExe.FullName)"
          $srcDir = $mainExe.DirectoryName
          New-Item -ItemType Directory -Force -Path "artifact" | Out-Null
          Copy-Item -Path "$srcDir\*" -Destination "artifact" -Recurse -Force

          $check = Get-ChildItem -Path "artifact" -Recurse -File |
            Where-Object { $_.Name -eq "Telegram.exe" -or $_.Name -eq "AyuGram.exe" } |
            Select-Object -First 1

          if (-not $check) {
            Write-Host "ERROR: EXE missing in artifact after copy"
            exit 1
          }

          $totalFiles = (Get-ChildItem -Path "artifact" -Recurse -File).Count
          $totalDlls  = (Get-ChildItem -Path "artifact" -Recurse -File -Filter "*.dll").Count
          Write-Host "SUCCESS: $($check.Name)"
          Write-Host "Total files : $totalFiles"
          Write-Host "DLL files   : $totalDlls"

      - uses: actions/upload-artifact@v4
        with:
          name: KiwiGram
          path: artifact\
          if-no-files-found: error
